[shell]
ui_scale = 0.9
ui_radius_scale = 0.5
setup_wizard_enabled = false
polkit_agent = true


[shell.animation]
speed = 1.5


[shell.panel]
transparency_mode = "soft"
open_near_click_control_center = true
open_near_click_wallpaper = true
open_near_click_session = true


[shell.launcher.dmenu.entry.run]
exec = "dash -c \"{query}\""
prefix = "x"
label = "Execute"
global = false
freeform = true


[shell.screenshot]
copy_to_clipboard = true

freeze_screen = true


[bar.main]
position = "bottom"

thickness = 16
background_opacity = 0.85
shadow = false
radius = 18
margin_ends = 188
margin_edge = 1
padding = 5
widget_spacing = 9
scale = 0.9


start = ["session", "group:g1"]
center = ["workspaces", "group:g2"]
end = ["media", "group:g3", "keyboard_layout", "control-center"]


[[bar.main.capsule_group]]
id = "g1"
members = ["weather", "date", "clock"]


[[bar.main.capsule_group]]
id = "g2"
members = ["cpu", "ram"]

[[bar.main.capsule_group]]
id = "g3"
members = [
  "tray",
  "notifications",
  "clipboard",
  "volume",
  "brightness",
  "network",
  "bluetooth",
  "battery",
]


[widget.battery]
display_mode = "graphic"
show_label = false


[widget.brightness]
show_label = false


[widget.clock]
color = "secondary"
format = "{:%-I:%M}"


[widget.control-center]
capsule = true
color = "primary"


[widget.cpu]
label_show_units = false


[widget.date]
color = "tertiary"


[widget.keyboard_layout]
show_glyph = false


[widget.media]
album_art_only = true


[widget.network]
show_label = false


[widget.ram]
type = "sysmon"
stat = "ram_pct"
label_show_units = false


[widget.session]
capsule = true
color = "primary"


[widget.volume]
show_label = false


[widget.workspaces]
capsule = true
style = "focus_hint"


[audio]
enable_overdrive = true
sound_volume = 0.8


[battery]
warning_threshold = 25


[system.monitor]
cpu_poll_seconds = 10.0
gpu_poll_seconds = 25.0
memory_poll_seconds = 10.0
network_poll_seconds = 15.0
disk_poll_seconds = 50.0


[location]
auto_locate = true
