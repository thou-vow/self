[shell]
ui_scale = 0.9
ui_radius_scale = 0.5
setup_wizard_enabled = false
polkit_agent = true


[shell.animation]
speed = 1.5


[shell.panel]
transparency_mode = "soft"
open_near_click_control_center = true
open_near_click_wallpaper = true
open_near_click_session = true


[shell.launcher.dmenu.entry.run]
exec = "dash -c \"{query}\""
prefix = "x"
label = "Execute"
global = false
freeform = true


[shell.screenshot]
copy_to_clipboard = true

freeze_screen = true


[bar.main]
position = "bottom"

thickness = 16
background_opacity = 0.8
shadow = false
radius = 0
margin_ends = 0
margin_edge = 0
padding = 37
widget_spacing = 21
scale = 0.9

start = ["session", "launcher", "wallpaper", "control-center", "workspaces"]
center = ["clock"]
end = [
  "media",
  "tray",
  "notifications",
  "clipboard",
  "network",
  "bluetooth",
  "volume",
  "brightness",
  "battery",
]
